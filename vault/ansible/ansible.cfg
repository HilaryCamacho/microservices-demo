[defaults]
inventory = inventory.ini
roles_path = roles
interpreter_python = auto_silent
callback_result_format = yaml

[ssh_connection]
pipelining = True
# Known hosts propio del entorno: la prueba de fuego lo borra al recrear la instancia
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=.ssh_known_hosts
