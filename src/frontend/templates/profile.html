
{{ define "profile" }}
{{ template "header" . }}

<main role="main" class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-lg-8">
      <div class="card p-4">
        <h2>👤 My Pet Profile</h2>
        <p>Choose your pet preferences to personalize your shopping experience.</p>

        <form method="POST" action="{{ $.baseUrl }}/setPetProfile">
          <div class="form-group mb-3">
            <label for="pet_type">Preferred pet</label>
            <select class="form-control" id="pet_type" name="pet_type"
                    onchange="updatePetOptions()">
              <option value="" {{ if not $.pet_type }}selected{{ end }}>All Pets</option>
              <option value="dog" {{ if eq $.pet_type "dog" }}selected{{ end }}>🐶 Dog</option>
              <option value="cat" {{ if eq $.pet_type "cat" }}selected{{ end }}>🐱 Cat</option>
              <option value="mouse" {{ if eq $.pet_type "mouse" }}selected{{ end }}>🐭 Mouse</option>
            </select>
          </div>

          <div class="form-group mb-3">
            <label for="pet_age">Age preference</label>
            <select class="form-control" id="pet_age" name="pet_age">
              <option value="" {{ if not $.pet_age }}selected{{ end }}>Any age</option>
              <option value="puppy" {{ if eq $.pet_age "puppy" }}selected{{ end }}>Puppy</option>
              <option value="kitten" {{ if eq $.pet_age "kitten" }}selected{{ end }}>Kitten</option>
              <option value="young" {{ if eq $.pet_age "young" }}selected{{ end }}>Young</option>
              <option value="adult" {{ if eq $.pet_age "adult" }}selected{{ end }}>Adult</option>
              <option value="senior" {{ if eq $.pet_age "senior" }}selected{{ end }}>Senior</option>
            </select>
          </div>

          <div class="form-group mb-4">
            <label for="pet_size">Size preference</label>
            <select class="form-control" id="pet_size" name="pet_size">
              <option value="" {{ if not $.pet_size }}selected{{ end }}>Any size</option>
              <option value="small" {{ if eq $.pet_size "small" }}selected{{ end }}>Small</option>
              <option value="medium" {{ if eq $.pet_size "medium" }}selected{{ end }}>Medium</option>
              <option value="large" {{ if eq $.pet_size "large" }}selected{{ end }}>Large</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Save Preferences</button>
          <a href="{{ $.baseUrl }}/" class="btn btn-secondary">Back to Shop</a>
        </form>
      </div>
    </div>
  </div>
</main>

{{ template "footer" . }}
{{ end }}
