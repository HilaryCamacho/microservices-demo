# CI: valida la infraestructura, corre pruebas y construye las imágenes Docker.
# - Pull requests a develop/main: build de verificación (sin push).
# - Push a develop/main (PR mergeado): build + push a Amazon ECR con el SHA del commit como tag.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write # OIDC para autenticarse en AWS sin access keys

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-2' }}
  ECR_PREFIX: ${{ vars.ECR_PREFIX || 'online-boutique' }}

jobs:
  validate:
    name: Validar Terraform y Helm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3

      - name: terraform fmt
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform validate
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - uses: azure/setup-helm@v4
        with:
          version: v4.0.1

      - name: helm lint
        run: helm lint helm-chart --set images.tag=ci

      - name: helm template
        run: helm template online-boutique helm-chart --set images.tag=ci > /dev/null

  test:
    name: Pruebas ${{ matrix.service }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # Servicios modificados por el perfil de mascota
        service: [frontend, productcatalogservice]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: src/${{ matrix.service }}/go.mod
          cache-dependency-path: src/${{ matrix.service }}/go.sum

      - name: go build
        working-directory: src/${{ matrix.service }}
        run: go build ./...

      - name: go test
        working-directory: src/${{ matrix.service }}
        run: go test ./...

  build:
    name: Build ${{ matrix.service }}
    needs: [validate, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service:
          - adservice
          - cartservice
          - checkoutservice
          - currencyservice
          - emailservice
          - frontend
          - loadgenerator
          - paymentservice
          - productcatalogservice
          - recommendationservice
          - shippingservice
    env:
      PUSH: ${{ github.event_name == 'push' }}
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Ruta del Dockerfile
        id: ctx
        run: |
          if [ "$SERVICE" = "cartservice" ]; then
            echo "path=src/cartservice/src" >> "$GITHUB_OUTPUT"
          else
            echo "path=src/$SERVICE" >> "$GITHUB_OUTPUT"
          fi

      - name: Credenciales AWS (OIDC)
        if: env.PUSH == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login a Amazon ECR
        if: env.PUSH == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Los tags en ECR son inmutables: si se re-ejecuta el workflow, no se vuelve a construir.
      - name: ¿La imagen ya existe en ECR?
        if: env.PUSH == 'true'
        id: exists
        run: |
          if aws ecr describe-images --repository-name "$ECR_PREFIX/$SERVICE" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.value != 'true'

      - name: Build${{ env.PUSH == 'true' && ' y push a ECR' || '' }}
        if: steps.exists.outputs.value != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.path }}
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ env.PUSH == 'true' && format('{0}/{1}/{2}:{3}', steps.ecr.outputs.registry, env.ECR_PREFIX, matrix.service, github.sha) || format('{0}:{1}', matrix.service, github.sha) }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Resumen
        if: env.PUSH == 'true'
        run: echo "- \`$SERVICE\` → \`$ECR_PREFIX/$SERVICE:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
